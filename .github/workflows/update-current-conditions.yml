name: Update Current Conditions

permissions:
  contents: write

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run METAR updater
        run: |
          python scripts/update_current_conditions.py

      - name: Commit updated JSON
        run: |
          git config user.name "ccw-bot"
          git config user.email "ccw-bot@users.noreply.github.com"
          git add current_conditions.json
          git commit -m "Update current conditions" || echo "No changes"
          git push
